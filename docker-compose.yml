x-django-env: &django-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: sistema_veterinaria_db
  DB_USER: root
  DB_PASSWORD: ""
  MICROSERVICES_HOST: 127.0.0.1
  REDIS_URL: redis://redis:6379/0
  MS_NOTIFICACIONES_URL: http://ms-notificaciones:8081
  MS_FACTURACION_URL: http://ms-facturacion:8082
  MS_TELEMEDICINA_URL: http://ms-telemedicina:8083
  MS_REPORTES_URL: http://ms-reportes:8084

services:
  db:
    image: mysql:8.4
    container_name: vetsystem_mysql
    restart: always
    environment:
      MYSQL_DATABASE: sistema_veterinaria_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - vetsystem_net

  redis:
    image: redis:7-alpine
    container_name: vetsystem_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - vetsystem_net

  web:
    build: .
    image: vetsystem:latest
    container_name: vetsystem_django_core
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn -c gunicorn.conf.py veterinaria.wsgi:application"
    environment:
      <<: *django-env
      GUNICORN_BIND: 0.0.0.0:8080
      GUNICORN_WORKERS: "3"
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - vetsystem_net

  ms-notificaciones:
    image: vetsystem:latest
    container_name: vetsystem_ms_notificaciones
    restart: always
    command: uvicorn microservicios.notificaciones.main:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    depends_on:
      - web
    networks:
      - vetsystem_net

  ms-facturacion:
    image: vetsystem:latest
    container_name: vetsystem_ms_facturacion
    restart: always
    command: uvicorn microservicios.facturacion_pagos.main:app --host 0.0.0.0 --port 8082
    ports:
      - "8082:8082"
    depends_on:
      - web
    networks:
      - vetsystem_net

  ms-telemedicina:
    image: vetsystem:latest
    container_name: vetsystem_ms_telemedicina
    restart: always
    command: uvicorn microservicios.telemedicina.main:app --host 0.0.0.0 --port 8083
    ports:
      - "8083:8083"
    depends_on:
      - web
    networks:
      - vetsystem_net

  ms-reportes:
    image: vetsystem:latest
    container_name: vetsystem_ms_reportes
    restart: always
    command: uvicorn microservicios.reportes_bi.main:app --host 0.0.0.0 --port 8084
    ports:
      - "8084:8084"
    depends_on:
      - web
    networks:
      - vetsystem_net

  nginx:
    image: nginx:alpine
    container_name: vetsystem_nginx_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/var/www/sistema-veterinaria/static:ro
      - ./media:/var/www/sistema-veterinaria/media:ro
    depends_on:
      - web
      - ms-notificaciones
      - ms-facturacion
      - ms-telemedicina
      - ms-reportes
    networks:
      - vetsystem_net

volumes:
  mysql_data:
  redis_data:

networks:
  vetsystem_net:
    driver: bridge
