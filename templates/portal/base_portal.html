<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi portal{% endblock %} - {{ configuracion.nombre_empresa|default:"VetSystem" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .portal-nav { background: linear-gradient(135deg, #0bb8c8, #0891b2); }
        .tarjeta { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(15, 23, 42, .06); padding: 1.5rem; }
        .cita-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem; }
        .cita-item + .cita-item { margin-top: .75rem; }
        .btn-video { background: #16a34a; color: #fff; border: none; }
        .btn-video:hover { background: #15803d; color: #fff; }
    </style>
</head>
<body>
    <nav class="portal-nav text-white py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="{% url 'portal_inicio' %}" class="text-white text-decoration-none fw-bold fs-5">
                <i class="fa-solid fa-paw me-2"></i>{{ configuracion.nombre_empresa|default:"VetSystem" }} <span class="fw-normal opacity-75">· Portal de clientes</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="d-none d-md-inline"><i class="fa-solid fa-user me-1"></i>{{ request.user.get_full_name|default:request.user.email }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-light"><i class="fa-solid fa-arrow-right-from-bracket me-1"></i>Salir</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="container pb-5">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
