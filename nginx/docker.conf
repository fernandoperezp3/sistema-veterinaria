upstream django_core {
    server web:8080;
}

upstream ms_notificaciones {
    server ms-notificaciones:8081;
}

upstream ms_facturacion {
    server ms-facturacion:8082;
}

upstream ms_telemedicina {
    server ms-telemedicina:8083;
}

upstream ms_reportes {
    server ms-reportes:8084;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /static/ {
        alias /var/www/sistema-veterinaria/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/sistema-veterinaria/media/;
        expires 7d;
        access_log off;
    }

    location /api/v1/notificaciones/ {
        proxy_pass http://ms_notificaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/facturacion/ {
        proxy_pass http://ms_facturacion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://ms_telemedicina;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sala/ {
        proxy_pass http://ms_telemedicina;
        proxy_set_header Host $host;
    }

    location /api/v1/reportes/ {
        proxy_pass http://ms_reportes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://django_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
