map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream django_core {
    server host.docker.internal:8080;
}

upstream ms_notificaciones {
    server host.docker.internal:8081;
}

upstream ms_facturacion {
    server host.docker.internal:8082;
}

upstream ms_telemedicina {
    server host.docker.internal:8083;
}

upstream ms_reportes {
    server host.docker.internal:8084;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/vetsystem.crt;
    ssl_certificate_key /etc/nginx/certs/vetsystem.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /ws/ {
        proxy_pass http://ms_telemedicina;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /sala/ {
        proxy_pass http://ms_telemedicina;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/notificaciones/ {
        proxy_pass http://ms_notificaciones;
        proxy_set_header Host $http_host;
    }

    location /api/v1/facturacion/ {
        proxy_pass http://ms_facturacion;
        proxy_set_header Host $http_host;
    }

    location /api/v1/reportes/ {
        proxy_pass http://ms_reportes;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://django_core;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
