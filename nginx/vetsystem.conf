# =============================================================================
# Configuración Nginx para Sistema Veterinario "VetSystem"
# Arquitectura: Monolito Modular Django + 4 Microservicios Satélite + WebSockets
# =============================================================================

upstream django_core {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream ms_notificaciones {
    server 127.0.0.1:8081;
}

upstream ms_facturacion {
    server 127.0.0.1:8082;
}

upstream ms_telemedicina {
    server 127.0.0.1:8083;
}

upstream ms_reportes {
    server 127.0.0.1:8084;
}

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name vetsystem.clinica.com www.vetsystem.clinica.com;
    return 301 https://$host$request_uri;
}

# Servidor Principal HTTPS
server {
    listen 443 ssl http2;
    server_name vetsystem.clinica.com www.vetsystem.clinica.com;

    # Certificados SSL / TLS 1.3
    ssl_certificate /etc/letsencrypt/live/vetsystem.clinica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetsystem.clinica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de Seguridad Perimetral
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1. Archivos Estáticos Servidos Directamente por Nginx
    location /static/ {
        alias /var/www/sistema-veterinaria/static/;
        expires 30d;
        access_log off;
    }

    # 2. Archivos Multimedia (Fotos de Mascotas, Logos, Recetas)
    location /media/ {
        alias /var/www/sistema-veterinaria/media/;
        expires 7d;
        access_log off;
    }

    # 3. Ruteo hacia Microservicio 1: Notificaciones y Recordatorios (:8081)
    location /api/v1/notificaciones/ {
        proxy_pass http://ms_notificaciones;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Ruteo hacia Microservicio 2: Facturación Electrónica & Pagos (:8082)
    location /api/v1/facturacion/ {
        proxy_pass http://ms_facturacion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5. Ruteo hacia Microservicio 3: Telemedicina & WebSockets en Tiempo Real (:8083)
    location /ws/ {
        proxy_pass http://ms_telemedicina;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 6. Ruteo hacia Microservicio 4: Reportes Asíncronos & BI (:8084)
    location /api/v1/reportes/ {
        proxy_pass http://ms_reportes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Ruteo Principal: Core Backend Monolito Django (Gunicorn WSGI)
    location / {
        proxy_pass http://django_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
